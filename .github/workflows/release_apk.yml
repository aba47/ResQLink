name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DisasterReady APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: DisasterReady ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### DisasterReady (ResQLink) Emergency APK
            Offline-first natural disaster emergency assistance and coordination application.

            #### Download
            - **[app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk)**

            #### Features in this release
            - 15 SQLite offline tables with persistence
            - Emergency requests & 5-stage responder pipeline
            - Disaster feeds & damage reports
            - Facilities catalog (Shelters, Hospitals, Helplines, Safe Zones, Resources)
            - 2-Way Sync Engine & local FastAPI backend
            - P2P Bluetooth emergency coordination protocol envelope & staging queue
